name: PostureMalone
options:
  bundleIdPrefix: com.pratikaman
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  PostureMalone:
    type: application
    platform: macOS
    sources: [PostureMalone]
    info:
      path: PostureMalone/Info.plist
      properties:
        NSMotionUsageDescription: Posture Malone reads your AirPods' motion sensors to detect sustained neck tilt and remind you to sit up.
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: "Posture Malone"
        INFOPLIST_FILE: PostureMalone/Info.plist
schemes:
  PostureMalone:
    build:
      targets:
        PostureMalone: all
    run:
      config: Debug
